services:
  server:
    build: ./server
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      # SQLite-файл лежит в именованном томе, чтобы данные переживали пересоздание контейнера
      DATABASE_URL: "file:/data/dev.db"
      CLIENT_URL: "http://localhost:5173"
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./shared:/shared
      - server-data:/data

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: "http://server:3001"
    volumes:
      - ./client:/app
      - /app/node_modules
      - ./shared:/shared
    depends_on:
      - server

volumes:
  server-data:
